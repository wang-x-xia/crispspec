[project]
name = "crispspec"
version = "0.1.0"
description = "使用严谨的规范定义软件"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Source root for first-party import detection: the project root, so that
# `src.db...` is recognised as first-party (and separated from third-party).
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # D203 and D211 are incompatible
    "D203",
    # D212 and D213 are incompatible
    "D213",
]
allowed-confusables = ["（", "）"]

[tool.ruff.lint.per-file-ignores]
# Allow 'assert' in tests/**
"tests/**" = ["S101"]
# Dynamic table name cause S608 issue, use a separated file.
"src/db/sql.py" = ["S608"]
# `secret` is an artifact type name (SEC-\d+), not a hardcoded credential.
"src/db/types.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
# The `src` package lives at the project root but the project is not
# installed as a distribution, so make it importable from the repo root.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15.12",
]

