# 制品实现进度登记表
#
# 这份文件是 src/db/types.py 里那 35 个制品类型的"实现状态看板"。
# 它是 STATUS.md 第四节「制品覆盖度」的机器可读版本，由 tests/registry/ 保证不漂移。
#
# 与其他清单的关系：
#   src/db/types.py    运行时类型常量（唯一权威的类型集合）
#   src/db/mapping.py  类型 ↔ ID 前缀映射
#   concepts.md        制品体系全景（域模型、关系图）
#   STATUS.md          项目现状（进度、遗留问题、决策记录）
#
# 字段说明：
#   type        制品类型键，须与 src/db/types.py 的常量值一致
#   name        制品名
#   id_prefix   ID 前缀，须与 src/db/mapping.py 一致
#   domain      所属域
#   definition  制品定义文件（相对仓库根目录）
#   manager     实现该制品的 Python 模块；null = 尚未实现
#   tests       测试文件；null = 尚未实现
#   status      done = 已有管理器；not-started = 尚未实现
#   stage       计划在哪个 Stage 实现（1 / 2）
#   priority    P0 关键路径 / P1 重要 / P2 可延后
#   depends_on  实现前应先具备的制品类型
#   notes       备注

meta:
  updated: "2026-11-09"
  # 本看板描述的代码状态（PR #1 合并后的 main）。不随无关提交漂移。
  baseline: "eda734c"
  counts:
    total: 35
    done: 3
    not_started: 32
    stage_1: 17
    stage_2: 18

domains:
  requirement:
    label: 需求域
    question: 用户要什么？怎么拆成可交付的单元？
  contract:
    label: 契约域
    question: 数据长什么样？模块间怎么通信？
  behavior:
    label: 行为域
    question: 状态怎么变？多个接口怎么协调？
  code:
    label: 代码域
    question: 代码在哪个仓库？逻辑制品怎么映射到物理代码？
  incident:
    label: 故障域
    question: 出了什么事？怎么恢复？
  governance:
    label: 治理域
    question: 性能底线是什么？用了哪些第三方依赖？
  access:
    label: 访问控制域
    question: 谁能访问什么？权限怎么判定？
  delivery:
    label: 交付域
    question: 部署到哪？配置怎么管？
  verification:
    label: 验证域
    question: 怎么证明这个制品是对的？
  organization:
    label: 组织单元
    question: 哪些制品归谁管？
  meta:
    label: 元制品
    question: 制品本身的结构由谁定义？

# 开发主线：从意图到运维的完整链路。
#
# 与 domains/ 的区别：域是"关注点"的横向切分，主线是"工作顺序"的纵向推进。
# 同一件制品在主线里只出现一次，所以 35 种制品被串成了一条不重不漏的链。
#
# produces  这一步产出的制品
# prepares  涉及但不由这一步产出的制品——它可以早就准备好（业务概念、错误目录、
#           仓库、环境、权限……），也可以就在这一步创建。主线不保证它由这一步产生。
# handoff   这一阶段与主线其他阶段之间的交接边，每一条都必须是真实存在的关系边
#           （tests/registry/ 会核对关系表，改了定义而没改主线就会红）。
#
# lateral: true 的阶段是横切关注点——它们不推进主线，但贯穿主线全程。
mainline:
  - id: intent
    label: 意图捕获
    question: 人类原始意图是什么？
    produces: [draft]

  - id: requirement
    label: 结构化需求
    question: 消歧之后的需求是什么？
    produces: [requirement]
    # 业务概念可以预先定义好，也可以在结构化需求时创建——它不是这一步的必然产物
    prepares: [business-concept]
    handoff:
      - {relation: DISAMBIGUATED_INTO, from: draft, to: requirement}
      - {relation: ACTED_BY, from: requirement, to: business-concept}

  - id: story
    label: 需求分解
    question: 拆成哪些可交付的单元？
    produces: [user-story]
    handoff:
      - {relation: DECOMPOSES_INTO, from: requirement, to: user-story}

  - id: contract
    label: 契约定义
    question: 数据长什么样？模块间怎么通信？
    produces: [interface, entity, event]
    # 错误目录通常是先攒出来的，不是等接口写完才有
    prepares: [error]
    handoff:
      - {relation: IMPLEMENTED_BY, from: user-story, to: interface}
      - {relation: AS_ACTION, from: business-concept, to: interface}
      - {relation: AS_OBJECT, from: business-concept, to: entity}
      - {relation: AS_ERROR, from: business-concept, to: error}
      - {relation: AS_EVENT, from: business-concept, to: event}

  - id: behavior
    label: 行为建模
    question: 状态怎么变？多个接口怎么协调？
    produces: [process, orchestration, reaction, schedule]
    handoff:
      - {relation: IMPLEMENTED_BY, from: user-story, to: orchestration}
      - {relation: IMPLEMENTED_BY, from: user-story, to: reaction}
      - {relation: IMPLEMENTED_BY, from: user-story, to: schedule}
      - {relation: COMPOSES, from: orchestration, to: interface}
      - {relation: TRANSITIONS, from: process, to: entity}
      - {relation: LISTENS_TO, from: reaction, to: event}

  - id: organization
    label: 组织归属
    question: 这些制品归哪个模块管？
    produces: [module]
    handoff:
      - {relation: EXPOSES, from: module, to: interface}
      - {relation: GOVERNED_BY, from: module, to: process}
      - {relation: PUBLISHES, from: module, to: event}

  - id: code
    label: 代码落地
    question: 逻辑制品对应哪些源码？
    produces: [code-ref]
    # 仓库先建起来，之后才往里面映射
    prepares: [repository]
    handoff:
      - {relation: MAPPED_TO, from: module, to: code-ref}
      - {relation: LOCATED_IN, from: code-ref, to: repository}

  - id: verification
    label: 验证闭环
    question: 怎么证明这个制品是对的？
    produces:
      - acceptance-test
      - scenario-test
      - contract-test
      - transition-test
      - integration-test
      - benchmark
    handoff:
      - {relation: TESTED_BY, from: requirement, to: acceptance-test}
      - {relation: TESTED_BY, from: user-story, to: scenario-test}
      - {relation: TESTED_BY, from: interface, to: contract-test}
      - {relation: TESTED_BY, from: process, to: transition-test}
      - {relation: TESTED_BY, from: module, to: integration-test}
      - {relation: TESTED_BY, from: constraint, to: benchmark}

  - id: delivery
    label: 交付上线
    question: 部署到哪？配置怎么管？
    produces: [pipeline]
    # 环境、配置与密钥通常由运维预先备好，不是写流水线时顺手产生的
    prepares: [environment, config-set, configuration, secret]
    handoff:
      - {relation: BUILDS, from: pipeline, to: module}
      - {relation: DEPLOYS_TO, from: pipeline, to: environment}
      - {relation: USES_CONFIG, from: environment, to: config-set}
      - {relation: OVERRIDES, from: config-set, to: configuration}
      - {relation: REQUIRES, from: environment, to: secret}

  - id: operation
    label: 运维反馈
    question: 出了什么事？怎么恢复？
    produces: [incident, runbook, playbook]
    handoff:
      - {relation: AFFECTS, from: incident, to: entity}
      - {relation: RESOLVED_BY, from: incident, to: runbook}
      - {relation: HANDLES, from: playbook, to: incident}

  - id: governance
    label: 治理约束
    question: 底线是什么？依赖了谁？
    lateral: true
    prepares: [constraint, metric, dependency]
    handoff:
      - {relation: CONSTRAINED_BY, from: module, to: constraint}
      - {relation: MEASURES, from: constraint, to: metric}
      - {relation: DEPENDS_ON, from: module, to: dependency}

  - id: access
    label: 访问控制
    question: 谁能访问什么？
    lateral: true
    prepares: [role, permission]
    handoff:
      - {relation: AUTHORIZED_BY, from: interface, to: role}
      - {relation: HAS_PERMISSION, from: role, to: permission}
      - {relation: AUTHORIZED_BY, from: secret, to: permission}

  - id: meta
    label: 制品结构
    question: 每个制品的结构由谁定义？
    lateral: true
    prepares: [type-def]

