domains:
  requirement:
    label: 需求域
    question: 用户要什么？怎么拆成可交付的单元？
  contract:
    label: 契约域
    question: 数据长什么样？模块间怎么通信？
  behavior:
    label: 行为域
    question: 状态怎么变？多个接口怎么协调？
  code:
    label: 代码域
    question: 代码在哪个仓库？逻辑制品怎么映射到物理代码？
  incident:
    label: 故障域
    question: 出了什么事？怎么恢复？
  governance:
    label: 治理域
    question: 谁能做什么？性能底线是什么？
  delivery:
    label: 交付域
    question: 部署到哪？配置怎么管？
  verification:
    label: 验证域
    question: 怎么证明这个制品是对的？
  organization:
    label: 组织单元
    question: 哪些制品归谁管？
  meta:
    label: 元制品
    question: 制品本身的结构由谁定义？

