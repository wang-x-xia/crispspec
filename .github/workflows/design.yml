name: design

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  design:
    name: 制品体系与前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 一致性测试
        run: npm test

      - name: 静态检查
        run: npm run lint

      - name: 构建（编译内容 + 类型检查 + 生产构建）
        run: npm run build
