<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrispSpec 制品图谱</title>
<style>
:root {
  --bg: #0a0f1e;
  --bg-panel: #111a30;
  --bg-elev: #17223d;
  --bg-hover: #1e2b4d;
  --border: #24314f;
  --border-soft: #1b2540;
  --text: #e8eeff;
  --muted: #8fa1c7;
  --accent: #4f9dff;
  --accent-soft: rgba(79, 157, 255, 0.16);
  --danger: #f87171;
  --ok: #4ade80;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --radius: 10px;
}
body.light {
  --bg: #f4f7fc;
  --bg-panel: #ffffff;
  --bg-elev: #ffffff;
  --bg-hover: #eef3fb;
  --border: #d7e0ef;
  --border-soft: #e6ecf6;
  --text: #16203a;
  --muted: #5a6b8c;
  --accent: #1d6ff2;
  --accent-soft: rgba(29, 111, 242, 0.12);
  --shadow: 0 8px 24px rgba(21, 40, 82, 0.12);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 "Inter", "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ── Layout ─────────────────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: 18px;
  padding: 10px 18px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  width: 34px; height: 34px; flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  color: #fff; font-size: 17px; font-weight: 700;
}
.brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; }
.brand .subtitle { margin: 0; font-size: 12px; color: var(--muted); }

.views { display: flex; gap: 4px; padding: 3px; background: var(--bg-elev); border-radius: 9px; border: 1px solid var(--border); }
.view-tab {
  border: 0; background: transparent; color: var(--muted);
  padding: 6px 14px; border-radius: 7px; cursor: pointer; font-size: 13px;
}
.view-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
.view-tab:disabled { opacity: .4; cursor: not-allowed; }

.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search-wrap { position: relative; }
#search {
  width: 260px; padding: 7px 11px 7px 30px;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 8px; outline: none;
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#search::placeholder { color: var(--muted); }
.search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.icon-btn {
  width: 34px; height: 32px; display: grid; place-items: center;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer;
}
.icon-btn:hover { background: var(--bg-hover); }

.main { display: flex; flex: 1 1 auto; min-height: 0; }

/* ── Sidebar ────────────────────────────────────────────────────────── */
.sidebar {
  width: 268px; flex: 0 0 auto; overflow-y: auto;
  background: var(--bg-panel); border-right: 1px solid var(--border);
  padding: 14px;
}
.panel { margin-bottom: 18px; }
.panel > h2 {
  margin: 0 0 8px; font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; justify-content: space-between;
}
.panel .count { font-weight: 500; letter-spacing: 0; text-transform: none; }
.filter-list { list-style: none; margin: 0; padding: 0; }
.filter-list li { margin: 1px 0; }
.filter-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 7px; border-radius: 7px; cursor: pointer; user-select: none;
}
.filter-row:hover { background: var(--bg-hover); }
.filter-row input { accent-color: var(--accent); margin: 0; cursor: pointer; }
.filter-row .swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.filter-row .label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filter-row .num { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.filter-row.off { opacity: .42; }
.chip {
  display: inline-block; padding: 1px 6px; border-radius: 5px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
}
.chip.done { background: rgba(74, 222, 128, .16); color: #4ade80; }
.chip.wip { background: rgba(148, 163, 184, .16); color: #94a3b8; }

.control { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
.control label { color: var(--muted); flex: 1 1 auto; }
.control select {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 8px; outline: none;
}
.btn {
  width: 100%; padding: 7px 10px; border-radius: 8px; cursor: pointer;
  background: var(--bg-elev); border: 1px solid var(--border);
}
.btn:hover { background: var(--bg-hover); }

/* ── Canvas ─────────────────────────────────────────────────────────── */
.canvas { position: relative; flex: 1 1 auto; min-width: 0; background:
  radial-gradient(circle at 30% 20%, rgba(79,157,255,.07), transparent 55%),
  radial-gradient(circle at 75% 80%, rgba(139,92,246,.06), transparent 50%),
  var(--bg); }
#graph { width: 100%; height: 100%; display: block; cursor: grab; }
#graph.panning { cursor: grabbing; }
.overlay {
  position: absolute; background: color-mix(in srgb, var(--bg-panel) 88%, transparent);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 12px; font-size: 12px; color: var(--muted);
  backdrop-filter: blur(6px); pointer-events: none;
}
.overlay.stats { left: 14px; bottom: 14px; display: flex; gap: 16px; }
.overlay.stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.overlay.hint { right: 14px; bottom: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; max-width: 460px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

/* ── Detail panel ───────────────────────────────────────────────────── */
.detail {
  width: 360px; flex: 0 0 auto; overflow-y: auto;
  background: var(--bg-panel); border-left: 1px solid var(--border);
  padding: 16px;
}
.detail .empty { color: var(--muted); text-align: center; padding-top: 60px; line-height: 1.9; }
.detail h3 { margin: 0 0 2px; font-size: 17px; }
.detail .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 6px; font-size: 11.5px;
  background: var(--bg-elev); border: 1px solid var(--border);
}
.badge .swatch { width: 8px; height: 8px; border-radius: 2px; }
.detail h4 {
  margin: 16px 0 7px; font-size: 11px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  border-top: 1px solid var(--border-soft); padding-top: 12px;
}
.detail h4:first-of-type { border-top: 0; padding-top: 0; }
table.fields { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.fields th {
  text-align: left; font-weight: 600; color: var(--muted);
  font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--border-soft);
}
table.fields td { padding: 5px 6px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
table.fields td.name { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--accent); white-space: nowrap; }
table.fields td.type { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
table.fields td.constraint { color: #c084fc; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
.rel-list { list-style: none; margin: 0; padding: 0; }
.rel-list li { margin: 3px 0; }
.rel-link {
  display: flex; align-items: baseline; gap: 7px; width: 100%;
  text-align: left; padding: 6px 8px; border-radius: 7px;
  background: var(--bg-elev); border: 1px solid var(--border-soft);
  cursor: pointer;
}
.rel-link:hover { background: var(--bg-hover); border-color: var(--accent); }
.rel-link .rel { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--accent); flex: 0 0 auto; }
.rel-link .tgt { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel-link .dir { color: var(--muted); font-size: 11px; flex: 0 0 auto; }
pre.raw {
  margin: 0; padding: 10px; border-radius: 8px; overflow-x: auto;
  background: var(--bg-elev); border: 1px solid var(--border-soft);
  font: 11.5px/1.5 ui-monospace, Menlo, monospace; color: var(--muted);
  max-height: 320px;
}
.note { color: var(--muted); font-size: 12.5px; margin: 0 0 4px; }

/* ── Graph primitives ───────────────────────────────────────────────── */
.edge { fill: none; stroke: #6b7fa8; stroke-width: 1.4px; opacity: .55; transition: opacity .15s, stroke .15s; }
.edge.dim { opacity: .07; }
.edge.hot { opacity: 1; stroke: var(--accent); stroke-width: 2.2px; }
.edge.both { stroke-dasharray: 6 4; }
/* 归属（包含）不是流向：细虚线，不带箭头 */
.edge.contain { stroke-dasharray: 3 4; stroke-width: 1.1px; opacity: .4; }
.edge.contain.hot { stroke: var(--accent); stroke-width: 2.2px; opacity: 1; }
.edge-label {
  font: 9.5px ui-monospace, Menlo, monospace; fill: var(--muted);
  paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
  pointer-events: none; user-select: none;
}
.edge-label.dim { opacity: .05; }
.edge-label.hot { fill: var(--accent); font-weight: 700; }

/* ── Mainline bands ─────────────────────────────────────────────────── */
.band { cursor: pointer; }
.band-bg { fill: rgba(120, 145, 200, .05); stroke: var(--border-soft); stroke-width: 1; }
.band.lateral .band-bg { fill: rgba(120, 145, 200, .02); stroke-dasharray: 6 5; }
.band:hover .band-bg { fill: rgba(120, 145, 200, .1); }
.band.selected .band-bg { fill: var(--accent-soft); stroke: var(--accent); }
.band-step-bg { fill: var(--accent); }
.band.lateral .band-step-bg { fill: transparent; stroke: var(--muted); stroke-dasharray: 3 2; }
.band-step {
  font: 700 11px ui-monospace, Menlo, monospace; fill: #fff;
  text-anchor: middle; dominant-baseline: central; pointer-events: none;
}
.band.lateral .band-step { fill: var(--muted); }
.band-title { font: 600 13.5px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--text); pointer-events: none; }
.band-question { font: 11.5px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--muted); pointer-events: none; }
.band-count { font: 10.5px ui-monospace, Menlo, monospace; fill: var(--muted); pointer-events: none; }
.band-split { stroke: var(--border); stroke-width: 1; stroke-dasharray: 4 4; }
.band-split-label { font: 10px "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--muted); text-anchor: end; pointer-events: none; }
.spine { stroke: var(--border); stroke-width: 2; fill: none; }
.mainline .edge { opacity: .1; }
.mainline .edge.main { opacity: 1; stroke: var(--accent); stroke-width: 2.2px; }
.mainline .edge.main.hot { stroke-width: 3px; }
.mainline .edge-label { opacity: .12; }
.mainline .edge-label.main { opacity: 1; fill: var(--accent); font-weight: 700; }
.mainline .edge-label.main.hot { fill: #fff; }
.mainline .node { opacity: .45; }
.mainline .node.on-spine { opacity: 1; }
.mainline .node.dim { opacity: .08; }

.overlay.mainline-legend { left: 14px; bottom: 52px; display: flex; gap: 14px; }
.overlay.mainline-legend span { display: inline-flex; align-items: center; gap: 5px; }
.overlay.mainline-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.overlay.mainline-legend .dot.main { background: var(--accent); }
.overlay.mainline-legend .dot.side { background: #6b7fa8; }
.overlay.mainline-legend .dot.prepared { background: transparent; border: 1px dashed var(--muted); }
.overlay.mainline-legend .dot.lateral { background: transparent; border: 1px dashed var(--muted); }
.node { cursor: pointer; }
.node .halo { fill: none; stroke: transparent; stroke-width: 6; }
.node .body { stroke: var(--bg); stroke-width: 2; transition: stroke .15s; }
/* Module 是容器：画成框，不画成点 */
.node.container .body {
  fill: color-mix(in srgb, var(--domain) 22%, transparent);
  stroke: var(--domain); stroke-width: 2.5;
}
.node.container .halo { stroke: color-mix(in srgb, var(--domain) 45%, transparent); }
.node.container .title { font-weight: 700; fill: var(--text); }
.node.container .prefix { fill: color-mix(in srgb, var(--domain) 75%, var(--muted)); }
.node.container .kind { font: 10px "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--muted); text-anchor: middle; }
.node .title { font: 600 12px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--text); text-anchor: middle; pointer-events: none; }
.node .prefix { font: 700 9px ui-monospace, Menlo, monospace; text-anchor: middle; pointer-events: none; }
.node.dim { opacity: .16; }
.node.missing .body { fill: color-mix(in srgb, var(--danger) 20%, transparent); stroke: var(--danger); stroke-dasharray: 3 2; }
.node.missing .prefix { fill: var(--danger); }
.node.prepared .body {
  fill: color-mix(in srgb, var(--domain) 18%, transparent);
  stroke: var(--domain); stroke-dasharray: 4 3;
}
.node.prepared .prefix { fill: color-mix(in srgb, var(--domain) 60%, var(--muted)); }
.node.prepared .title { fill: var(--muted); }
.node.prepared .halo { stroke: color-mix(in srgb, var(--domain) 30%, transparent); }
.node.selected .body { stroke: #fff; stroke-width: 2.6; }
.node.selected .halo { stroke: var(--accent); }
.node.neighbor .halo { stroke: color-mix(in srgb, var(--accent) 55%, transparent); }
.node:hover .body { stroke: #fff; }
.node text { user-select: none; }

.tooltip {
  position: absolute; pointer-events: none; z-index: 20;
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 9px; font-size: 12px;
  box-shadow: var(--shadow); opacity: 0; transition: opacity .12s;
  white-space: nowrap;
}
.tooltip.show { opacity: 1; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">◆</div>
      <div>
        <h1>CrispSpec 制品图谱</h1>
        <p class="subtitle" id="subtitle">载入中…</p>
      </div>
    </div>
    <div class="views" role="tablist">
      <button class="view-tab active" data-view="schema" type="button">体系图</button>
      <button class="view-tab" data-view="mainline" type="button">开发主线</button>
      <button class="view-tab" data-view="instances" id="instanceTab" type="button" disabled>实例图</button>
    </div>
    <div class="tools">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="search" type="search" placeholder="搜索制品名 / ID 前缀 / 关系…" autocomplete="off" spellcheck="false">
      </div>
      <button class="icon-btn" id="themeBtn" type="button" title="切换明暗主题">◐</button>
      <button class="icon-btn" id="fitBtn" type="button" title="适应视图 (F)">⤢</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <section class="panel">
        <h2>域 <span class="count" id="domainCount"></span></h2>
        <ul class="filter-list" id="domainFilters"></ul>
      </section>
      <section class="panel" id="relationPanel">
        <h2>关系类型 <span class="count" id="relationCount"></span></h2>
        <ul class="filter-list" id="relationFilters"></ul>
      </section>
      <section class="panel" id="statusPanel">
        <h2>实现状态</h2>
        <ul class="filter-list" id="statusFilters"></ul>
      </section>
      <section class="panel">
        <h2>布局</h2>
        <div class="control">
          <label for="layoutSel">算法</label>
          <select id="layoutSel">
            <option value="force">力导向</option>
            <option value="domain">按域聚类</option>
            <option value="radial">同心圆</option>
          </select>
        </div>
        <div class="control">
          <label for="labelsChk">显示关系标签</label>
          <input type="checkbox" id="labelsChk" checked>
        </div>
        <div class="control">
          <label for="dimChk">聚焦模式（弱化无关）</label>
          <input type="checkbox" id="dimChk" checked>
        </div>
        <button class="btn" id="resetBtn" type="button">重置筛选与视图</button>
      </section>
    </aside>

    <section class="canvas" id="canvas">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="overlay stats" id="stats"></div>
      <div class="overlay hint" id="hint">拖拽节点 · 滚轮缩放 · 单击查看详情 · 双击聚焦</div>
      <div class="overlay mainline-legend" id="mainlineLegend" hidden>
        <span><i class="dot main"></i>主线交接</span>
        <span><i class="dot side"></i>上下文关系</span>
        <span><i class="dot prepared"></i>可提前准备</span>
        <span><i class="dot lateral"></i>横切关注点</span>
      </div>
    </section>

    <aside class="detail" id="detail">
      <div class="empty">
        点击图中的节点<br>查看制品定义与关系
      </div>
    </aside>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script id="crisp-spec-data" type="application/json">__CRISP_SPEC_DATA__</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("crisp-spec-data").textContent);
  var SVG_NS = "http://www.w3.org/2000/svg";
  var BASE = DATA.basePath || "../";

  var domainColor = {};
  var domainLabel = {};
  DATA.domains.forEach(function (d) {
    domainColor[d.key] = d.color;
    domainLabel[d.key] = d.label;
  });

  var state = {
    view: "schema",
    layout: "force",
    showLabels: true,
    dimMode: true,
    query: "",
    domains: {},
    relations: {},
    statuses: { done: true, "not-started": true },
    selected: null,
    transform: { x: 0, y: 0, k: 1 },
    graph: null
  };
  DATA.domains.forEach(function (d) { state.domains[d.key] = true; });
  DATA.relationTypes.forEach(function (r) { state.relations[r.name] = true; });

  // ── DOM handles ────────────────────────────────────────────────────────
  var svg = document.getElementById("graph");
  var viewport = document.createElementNS(SVG_NS, "g");
  viewport.setAttribute("id", "viewport");
  var bandLayer = document.createElementNS(SVG_NS, "g");
  var edgeLayer = document.createElementNS(SVG_NS, "g");
  var labelLayer = document.createElementNS(SVG_NS, "g");
  var nodeLayer = document.createElementNS(SVG_NS, "g");
  viewport.appendChild(bandLayer);
  viewport.appendChild(edgeLayer);
  viewport.appendChild(labelLayer);
  viewport.appendChild(nodeLayer);
  svg.appendChild(viewport);

  var defs = document.createElementNS(SVG_NS, "defs");
  defs.innerHTML =
    '<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7fa8"/></marker>' +
    '<marker id="arrow-hot" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9dff"/></marker>' +
    '<marker id="arrow-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9dff"/></marker>';
  svg.appendChild(defs);

  var detailEl = document.getElementById("detail");
  var statsEl = document.getElementById("stats");
  var tooltipEl = document.getElementById("tooltip");

  // ── Helpers ───────────────────────────────────────────────────────────
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function svgEl(tag, attrs) {
    var node = document.createElementNS(SVG_NS, tag);
    for (var key in attrs) {
      if (Object.prototype.hasOwnProperty.call(attrs, key)) node.setAttribute(key, attrs[key]);
    }
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  // ── Graph construction ────────────────────────────────────────────────
  function buildSchemaGraph() {
    var nodes = DATA.types.map(function (t) {
      return {
        id: t.id,
        label: t.name,
        prefix: t.prefix,
        domain: t.domain,
        status: t.status,
        radius: 15 + Math.min(9, (t.fields || []).length * 1.1),
        raw: t,
        x: 0, y: 0, vx: 0, vy: 0, fx: null, fy: null
      };
    });
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    var edges = [];
    DATA.edges.forEach(function (e) {
      var s = byId[e.source], t = byId[e.target];
      if (!s || !t) return;
      edges.push({ source: s, target: t, relation: e.relation, bidirectional: !!e.bidirectional, origin: e.origin });
    });
    return { nodes: nodes, edges: edges, byId: byId };
  }

  function buildMainlineGraph() {
    var phaseOf = {};
    var preparedOf = {};
    DATA.phases.forEach(function (phase) {
      phase.artifacts.forEach(function (id) { phaseOf[id] = phase; });
      (phase.prepares || []).forEach(function (id) { preparedOf[id] = true; });
    });
    var nodes = DATA.types.map(function (t) {
      var phase = phaseOf[t.id];
      return {
        id: t.id,
        label: t.name,
        prefix: t.prefix,
        domain: t.domain,
        status: t.status,
        phase: phase ? phase.id : null,
        prepared: !!preparedOf[t.id],
        lateral: phase ? !!phase.lateral : false,
        radius: 15 + Math.min(9, (t.fields || []).length * 1.1),
        raw: t,
        x: 0, y: 0, vx: 0, vy: 0, fx: null, fy: null
      };
    });
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    var edges = [];
    DATA.edges.forEach(function (e) {
      var s = byId[e.source], t = byId[e.target];
      if (!s || !t) return;
      edges.push({
        source: s, target: t, relation: e.relation,
        bidirectional: !!e.bidirectional, origin: e.origin,
        mainline: !!e.mainline
      });
    });
    edges.forEach(function (e) {
      if (!e.mainline) return;
      e.source.onSpine = true;
      e.target.onSpine = true;
    });
    return { nodes: nodes, edges: edges, byId: byId, bands: [], size: { width: 0, height: 0 } };
  }

  function buildInstanceGraph() {
    var inst = DATA.instances || { nodes: [], edges: [] };
    var nodes = inst.nodes.map(function (n) {
      return {
        id: n.id,
        label: n.name,
        prefix: n.id,
        domain: n.domain,
        status: "instance",
        missing: !!n.missing,
        radius: 13,
        raw: n,
        x: 0, y: 0, vx: 0, vy: 0, fx: null, fy: null
      };
    });
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    var edges = [];
    inst.edges.forEach(function (e) {
      var s = byId[e.source], t = byId[e.target];
      if (!s || !t) return;
      edges.push({ source: s, target: t, relation: e.relation, bidirectional: false, origin: e.field || "" });
    });
    return { nodes: nodes, edges: edges, byId: byId };
  }

  // ── Filtering ─────────────────────────────────────────────────────────
  function isVisible(node) {
    if (!state.domains[node.domain]) return false;
    if (state.view === "schema" && node.status && !state.statuses[node.status]) return false;
    return true;
  }
  function edgeVisible(edge) {
    if (!state.relations[edge.relation]) return false;
    return isVisible(edge.source) && isVisible(edge.target);
  }
  function matches(node) {
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    if (node.label.toLowerCase().indexOf(q) >= 0) return true;
    if (node.id.toLowerCase().indexOf(q) >= 0) return true;
    if ((node.prefix || "").toLowerCase().indexOf(q) >= 0) return true;
    if ((node.raw.definition || "").toLowerCase().indexOf(q) >= 0) return true;
    return false;
  }

  // ── Layout ────────────────────────────────────────────────────────────
  var REPULSION = 17000;
  var SPRING = 0.055;
  var REST = 135;
  var DAMP = 0.85;
  var MAXV = 24;

  function seedPositions(graph) {
    var w = svg.clientWidth || 1200, h = svg.clientHeight || 800;
    graph.nodes.forEach(function (n, i) {
      var angle = (i / Math.max(1, graph.nodes.length)) * Math.PI * 2;
      var radius = Math.min(w, h) * 0.33;
      n.x = w / 2 + Math.cos(angle) * radius;
      n.y = h / 2 + Math.sin(angle) * radius;
      n.vx = 0; n.vy = 0; n.fx = null; n.fy = null;
    });
  }

  function stepForce(graph, alpha) {
    var nodes = graph.nodes, edges = graph.edges;
    var w = svg.clientWidth || 1200, h = svg.clientHeight || 800;
    for (var i = 0; i < nodes.length; i++) {
      for (var j = i + 1; j < nodes.length; j++) {
        var n1 = nodes[i], n2 = nodes[j];
        var dx = n2.x - n1.x, dy = n2.y - n1.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        var d = Math.sqrt(d2);
        var f = REPULSION / d2 * alpha;
        var ux = dx / d, uy = dy / d;
        n1.vx -= ux * f; n1.vy -= uy * f;
        n2.vx += ux * f; n2.vy += uy * f;
      }
    }
    edges.forEach(function (e) {
      var s = e.source, t = e.target;
      var dx = t.x - s.x, dy = t.y - s.y;
      var d = Math.max(0.01, Math.sqrt(dx * dx + dy * dy));
      var f = (d - REST) * SPRING * alpha;
      var ux = dx / d, uy = dy / d;
      s.vx += ux * f; s.vy += uy * f;
      t.vx -= ux * f; t.vy -= uy * f;
    });
    nodes.forEach(function (n) {
      n.vx += (w / 2 - n.x) * 0.006 * alpha;
      n.vy += (h / 2 - n.y) * 0.006 * alpha;
    });
    nodes.forEach(function (n) {
      if (n.fx !== null) { n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; return; }
      n.vx *= DAMP; n.vy *= DAMP;
      n.vx = Math.max(-MAXV, Math.min(MAXV, n.vx));
      n.vy = Math.max(-MAXV, Math.min(MAXV, n.vy));
      n.x += n.vx; n.y += n.vy;
    });
  }

  function layoutDomain(graph) {
    var w = svg.clientWidth || 1200, h = svg.clientHeight || 800;
    var groups = {};
    graph.nodes.forEach(function (n) {
      (groups[n.domain] = groups[n.domain] || []).push(n);
    });
    var keys = Object.keys(groups);
    var cx = w / 2, cy = h / 2;
    var ring = Math.min(w, h) * 0.33;
    keys.forEach(function (key, gi) {
      var gAngle = (gi / keys.length) * Math.PI * 2 - Math.PI / 2;
      var gx = cx + Math.cos(gAngle) * ring;
      var gy = cy + Math.sin(gAngle) * ring;
      var list = groups[key];
      var inner = Math.min(w, h) * 0.13;
      list.forEach(function (n, i) {
        if (n.fx !== null) return;
        var a = (i / Math.max(1, list.length)) * Math.PI * 2;
        n.x = gx + Math.cos(a) * inner;
        n.y = gy + Math.sin(a) * inner;
        n.vx = 0; n.vy = 0;
      });
    });
  }

  // ── Mainline layout ──────────────────────────────────────────────────
  var RAIL = 208;      // 左侧阶段栏的宽度
  var CARD = 148;      // 卡片间距
  var ROW = 104;       // 行高
  var BAND_TOP = 72;   // 阶段栏（标题 + 问题）占用的高度
  var BAND_PAD = 30;   // 阶段带的下边距
  var BAND_GAP = 22;   // 阶段带之间的间距

  function layoutMainline(graph) {
    var width = (svg.clientWidth || 1200) - 40;
    var usable = Math.max(CARD, width - RAIL - 40);
    var perRow = Math.max(1, Math.floor(usable / CARD));
    var y = 24;

    graph.bands = [];
    DATA.phases.forEach(function (phase, index) {
      var produced = graph.nodes.filter(function (n) {
        return n.phase === phase.id && !n.prepared;
      });
      var prepared = graph.nodes.filter(function (n) {
        return n.phase === phase.id && n.prepared;
      });
      var prodRows = produced.length ? Math.ceil(produced.length / perRow) : 0;
      var prepRows = prepared.length ? Math.ceil(prepared.length / perRow) : 0;
      var rows = Math.max(1, prodRows + prepRows);
      var top = y;
      var height = BAND_TOP + rows * ROW + BAND_PAD;

      function place(list, offset) {
        list.forEach(function (n, i) {
          if (n.fx !== null) return;
          var col = i % perRow;
          var row = offset + Math.floor(i / perRow);
          n.x = RAIL + col * CARD + CARD / 2;
          n.y = top + BAND_TOP + row * ROW + ROW / 2;
          n.vx = 0; n.vy = 0;
        });
      }
      place(produced, 0);
      place(prepared, prodRows);

      graph.bands.push({
        phase: phase, index: index, top: top, height: height,
        count: produced.length + prepared.length,
        produced: produced.length, prepared: prepared.length,
        splitY: prodRows > 0 ? top + BAND_TOP + prodRows * ROW - 12 : null
      });
      y = top + height + BAND_GAP;
    });
    graph.size = { width: width, height: y };
    // 向后的边（反馈回路）各占一条车道，避免叠在一起
    var lane = 0;
    graph.edges.forEach(function (e) {
      if (e.target.y > e.source.y + 1) {
        e.lane = 0;
        return;
      }
      e.lane = lane;
      lane += 1;
    });
  }

  function buildBands() {
    var graph = state.graph;
    clear(bandLayer);
    var spine = svgEl("path", { "class": "spine" });
    bandLayer.appendChild(spine);
    graph.bands.forEach(function (band) {
      var group = svgEl("g", { "class": "band" + (band.phase.lateral ? " lateral" : "") });
      group.setAttribute("data-phase", band.phase.id);
      var rect = svgEl("rect", { "class": "band-bg", rx: 14 });
      var stepBg = svgEl("circle", { "class": "band-step-bg", r: 12 });
      var step = svgEl("text", { "class": "band-step" });
      step.textContent = band.phase.lateral ? "横切" : String(band.index + 1);
      var title = svgEl("text", { "class": "band-title" });
      title.textContent = band.phase.label;
      var question = svgEl("text", { "class": "band-question" });
      question.textContent = band.phase.question;
      var count = svgEl("text", { "class": "band-count" });
      count.textContent = band.produced
        ? "产出 " + band.produced + (band.prepared ? " · 预备 " + band.prepared : "")
        : "预备 " + band.prepared;
      var split = svgEl("line", { "class": "band-split" });
      var splitLabel = svgEl("text", { "class": "band-split-label" });
      splitLabel.textContent = "可提前准备";
      group.appendChild(rect);
      group.appendChild(split);
      group.appendChild(splitLabel);
      group.appendChild(stepBg);
      group.appendChild(step);
      group.appendChild(title);
      group.appendChild(question);
      group.appendChild(count);
      group.addEventListener("click", function () { selectPhase(band.phase); });
      bandLayer.appendChild(group);
      band.el = group;
      band.rect = rect;
      band.split = split;
      band.splitLabel = splitLabel;
      band.stepBg = stepBg;
      band.step = step;
      band.title = title;
      band.question = question;
      band.count = count;
    });
  }

  function updateBands() {
    var graph = state.graph;
    if (!graph.bands.length) return;
    graph.bands.forEach(function (band) {
      var width = graph.size.width;
      band.rect.setAttribute("x", 0);
      band.rect.setAttribute("y", band.top);
      band.rect.setAttribute("width", width);
      band.rect.setAttribute("height", band.height);
      band.stepBg.setAttribute("cx", 34);
      band.stepBg.setAttribute("cy", band.top + 30);
      band.step.setAttribute("x", 34);
      band.step.setAttribute("y", band.top + 31);
      band.title.setAttribute("x", 58);
      band.title.setAttribute("y", band.top + 27);
      band.question.setAttribute("x", 58);
      band.question.setAttribute("y", band.top + 47);
      band.count.setAttribute("x", 58);
      band.count.setAttribute("y", band.top + 65);
      if (band.splitY === null) {
        band.split.setAttribute("visibility", "hidden");
        band.splitLabel.setAttribute("visibility", "hidden");
      } else {
        band.split.setAttribute("visibility", "visible");
        band.splitLabel.setAttribute("visibility", "visible");
        band.split.setAttribute("x1", RAIL - 10);
        band.split.setAttribute("x2", width - 24);
        band.split.setAttribute("y1", band.splitY);
        band.split.setAttribute("y2", band.splitY);
        band.splitLabel.setAttribute("x", width - 28);
        band.splitLabel.setAttribute("y", band.splitY - 6);
      }
    });
    var spine = bandLayer.querySelector(".spine");
    if (spine) {
      var first = graph.bands[0];
      var last = graph.bands[graph.bands.length - 1];
      spine.setAttribute("d",
        "M 34 " + (first.top + 30) + " L 34 " + (last.top + 30));
    }
  }

  function mainlineEdgeGeometry(e) {
    var s = e.source, t = e.target;
    if (t.y > s.y + 1) {
      // 向前：自上而下穿过阶段带
      var sx = s.x, sy = s.y + s.radius + 2;
      var tx = t.x, ty = t.y - t.radius - 9;
      var midY = (sy + ty) / 2;
      return {
        d: "M " + sx + " " + sy + " C " + sx + " " + midY + ", " + tx + " " + midY + ", " + tx + " " + ty,
        mx: (sx + tx) / 2, my: midY
      };
    }
    // 向后（反馈回路）：绕到右侧
    var lane = Math.max(s.x, t.x) + 70 + (e.lane || 0) * 26;
    var bsx = s.x + s.radius, bsy = s.y;
    var btx = t.x + t.radius, bty = t.y;
    return {
      d: "M " + bsx + " " + bsy + " C " + lane + " " + bsy + ", " + lane + " " + bty + ", " + btx + " " + bty,
      mx: lane, my: (bsy + bty) / 2
    };
  }

  function layoutRadial(graph) {
    var w = svg.clientWidth || 1200, h = svg.clientHeight || 800;
    var cx = w / 2, cy = h / 2;
    var ring = Math.min(w, h) * 0.38;
    var n = graph.nodes.length;
    graph.nodes.forEach(function (node, i) {
      if (node.fx !== null) return;
      var a = (i / Math.max(1, n)) * Math.PI * 2;
      node.x = cx + Math.cos(a) * ring;
      node.y = cy + Math.sin(a) * ring;
      node.vx = 0; node.vy = 0;
    });
  }

  // ── Rendering ─────────────────────────────────────────────────────────
  function buildDom() {
    var graph = state.graph;
    clear(edgeLayer); clear(labelLayer); clear(nodeLayer); clear(bandLayer);
    viewport.setAttribute("class", state.view === "mainline" ? "mainline" : "");

    graph.nodes.forEach(function (n) {
      var container = n.id === "module";
      var g = svgEl("g", {
        "class": "node" + (n.missing ? " missing" : "") + (n.prepared ? " prepared" : "") +
          (container ? " container" : "")
      });
      g.setAttribute("data-id", n.id);
      var color = domainColor[n.domain] || "#64748b";
      g.style.setProperty("--domain", color);
      var title = svgEl("text", { "class": "title" });
      title.textContent = n.label;
      var prefix = svgEl("text", { "class": "prefix" });
      prefix.textContent = n.prefix || "";
      prefix.setAttribute("fill", "rgba(255,255,255,.82)");
      if (container) {
        // 容器画成框：宽一点、高一点，标题在框内
        var w = 138, h = 54;
        n.radius = 70;
        var halo = svgEl("rect", {
          "class": "halo", x: -w / 2, y: -h / 2, width: w, height: h, rx: 13
        });
        var body = svgEl("rect", {
          "class": "body", x: -w / 2, y: -h / 2, width: w, height: h, rx: 13
        });
        body.setAttribute("fill", color);
        title.setAttribute("y", 2);
        prefix.setAttribute("y", -h / 2 - 7);
        prefix.setAttribute("fill", "var(--muted)");
        var kind = svgEl("text", { "class": "kind", y: h / 2 + 13 });
        kind.textContent = "组织容器";
        g.appendChild(halo);
        g.appendChild(body);
        g.appendChild(prefix);
        g.appendChild(title);
        g.appendChild(kind);
        nodeLayer.appendChild(g);
        n.el = g;
        n.titleEl = title;
        return;
      }
      var halo = svgEl("circle", { "class": "halo", r: n.radius + 4 });
      var body = svgEl("circle", { "class": "body", r: n.radius });
      body.setAttribute("fill", color);
      title.setAttribute("y", n.radius + 14);
      prefix.setAttribute("y", 4);
      g.appendChild(halo);
      g.appendChild(body);
      g.appendChild(prefix);
      g.appendChild(title);
      nodeLayer.appendChild(g);
      n.el = g;
      n.titleEl = title;
    });

    graph.edges.forEach(function (e) {
      var contain = e.relation === "CONTAINS";
      var cls = "edge" + (e.bidirectional ? " both" : "") + (e.mainline ? " main" : "") +
        (contain ? " contain" : "");
      var path = svgEl("path", { "class": cls });
      if (!contain) {
        path.setAttribute("marker-end", e.mainline ? "url(#arrow-main)" : "url(#arrow)");
      }
      edgeLayer.appendChild(path);
      e.el = path;
      var label = svgEl("text", { "class": "edge-label" + (e.mainline ? " main" : "") });
      label.textContent = e.relation;
      labelLayer.appendChild(label);
      e.labelEl = label;
    });

    // Parallel edges between the same pair of nodes would overlap, so
    // they are spread apart.
    var pairs = {};
    graph.edges.forEach(function (e) {
      var key = e.source.id < e.target.id
        ? e.source.id + "|" + e.target.id
        : e.target.id + "|" + e.source.id;
      pairs[key] = (pairs[key] || 0) + 1;
    });
    var taken = {};
    graph.edges.forEach(function (e) {
      var key = e.source.id < e.target.id
        ? e.source.id + "|" + e.target.id
        : e.target.id + "|" + e.source.id;
      e.slot = taken[key] || 0;
      taken[key] = e.slot + 1;
      e.siblings = pairs[key];
    });
  }

  function edgeGeometry(e) {
    var s = e.source, t = e.target;
    if (s === t) {
      var r = s.radius + 14;
      return {
        d: "M " + (s.x - r * 0.4) + " " + (s.y - r) +
           " C " + (s.x - r * 2.4) + " " + (s.y - r * 3.2) + ", " +
                (s.x + r * 2.4) + " " + (s.y - r * 3.2) + ", " +
                (s.x + r * 0.4) + " " + (s.y - r),
        mx: s.x, my: s.y - r * 2.1
      };
    }
    var dx = t.x - s.x, dy = t.y - s.y;
    var d = Math.max(0.01, Math.sqrt(dx * dx + dy * dy));
    var ux = dx / d, uy = dy / d;
    var sx = s.x + ux * (s.radius + 1), sy = s.y + uy * (s.radius + 1);
    var tx = t.x - ux * (t.radius + 7), ty = t.y - uy * (t.radius + 7);
    var spread = e.siblings > 1 ? (e.slot - (e.siblings - 1) / 2) : 0;
    var curve = Math.min(52, d * 0.11) * (1 + spread * 0.55);
    var cx = (sx + tx) / 2 - uy * curve;
    var cy = (sy + ty) / 2 + ux * curve;
    return { d: "M " + sx + " " + sy + " Q " + cx + " " + cy + " " + tx + " " + ty, mx: cx, my: cy };
  }

  function updatePositions() {
    var graph = state.graph;
    graph.nodes.forEach(function (n) {
      if (!n.el) return;
      n.el.setAttribute("transform", "translate(" + n.x + "," + n.y + ")");
    });
    graph.edges.forEach(function (e) {
      if (!e.el) return;
      var g = state.view === "mainline" ? mainlineEdgeGeometry(e) : edgeGeometry(e);
      e.el.setAttribute("d", g.d);
      e.labelEl.setAttribute("x", g.mx);
      e.labelEl.setAttribute("y", g.my);
    });
    if (state.view === "mainline") updateBands();
  }

  function applyTransform() {
    var t = state.transform;
    viewport.setAttribute("transform", "translate(" + t.x + "," + t.y + ") scale(" + t.k + ")");
  }

  // ── Highlight ─────────────────────────────────────────────────────────
  function refreshHighlight() {
    var graph = state.graph;
    var selected = state.selected;
    var neighbors = {};
    if (selected) {
      neighbors[selected.id] = true;
      graph.edges.forEach(function (e) {
        if (e.source.id === selected.id) neighbors[e.target.id] = true;
        if (e.target.id === selected.id) neighbors[e.source.id] = true;
      });
    }
    var query = state.query;
    var hasQuery = !!query;
    var hasFocus = !!selected || hasQuery;

    graph.nodes.forEach(function (n) {
      var cls = "node" + (n.missing ? " missing" : "") + (n.prepared ? " prepared" : "") +
        (n.id === "module" ? " container" : "");
      var visible = isVisible(n);
      n.el.style.display = visible ? "" : "none";
      if (!visible) return;
      var hit = hasQuery ? matches(n) : true;
      if (state.dimMode && hasFocus && selected && !neighbors[n.id]) cls += " dim";
      if (state.dimMode && hasQuery && !hit) cls += " dim";
      if (selected && n.id === selected.id) cls += " selected";
      else if (selected && neighbors[n.id]) cls += " neighbor";
      if (state.view === "mainline" && n.onSpine) cls += " on-spine";
      n.el.setAttribute("class", cls);
      n.hit = hit;
    });

    graph.edges.forEach(function (e) {
      var visible = edgeVisible(e);
      e.el.style.display = visible ? "" : "none";
      e.labelEl.style.display = visible && state.showLabels ? "" : "none";
      if (!visible) return;
      var cls = "edge" + (e.bidirectional ? " both" : "") + (e.mainline ? " main" : "") +
        (e.relation === "CONTAINS" ? " contain" : "");
      var touches = selected && (e.source.id === selected.id || e.target.id === selected.id);
      if (state.dimMode && hasFocus && !touches) cls += " dim";
      if (touches) cls += " hot";
      e.el.setAttribute("class", cls);
      if (e.relation !== "CONTAINS") {
        e.el.setAttribute("marker-end", touches ? "url(#arrow-hot)"
          : (e.mainline ? "url(#arrow-main)" : "url(#arrow)"));
      }
      var lbl = "edge-label" + (e.mainline ? " main" : "");
      if (touches) lbl += " hot";
      else if (state.dimMode && hasFocus) lbl += " dim";
      e.labelEl.setAttribute("class", lbl);
    });
  }

  function updateStats() {
    var graph = state.graph;
    var visNodes = graph.nodes.filter(isVisible).length;
    var visEdges = graph.edges.filter(edgeVisible).length;
    var visRelations = {};
    graph.edges.forEach(function (e) {
      if (edgeVisible(e)) visRelations[e.relation] = true;
    });
    clear(statsEl);
    var items;
    if (state.view === "mainline") {
      var spine = graph.edges.filter(function (e) { return e.mainline && edgeVisible(e); }).length;
      items = [
        ["阶段", DATA.phases.length],
        ["制品", visNodes + " / " + graph.nodes.length],
        ["主线交接", spine]
      ];
    } else {
      items = [
        ["节点", visNodes + " / " + graph.nodes.length],
        ["关系", visEdges + " / " + graph.edges.length],
        ["关系类型", Object.keys(visRelations).length]
      ];
    }
    items.forEach(function (pair) {
      var span = el("span");
      span.appendChild(document.createTextNode(pair[0] + " "));
      span.appendChild(el("b", null, pair[1]));
      statsEl.appendChild(span);
    });
  }

  // ── Detail panel ──────────────────────────────────────────────────────
  function showDetail(node) {
    clear(detailEl);
    var raw = node.raw || {};
    var head = el("h3", null, node.label);
    detailEl.appendChild(head);

    var sub = el("div", "sub");
    sub.textContent = node.prefix + (raw.definition ? " · " + raw.definition : "");
    detailEl.appendChild(sub);

    var badges = el("div", "badge-row");
    var domainBadge = el("span", "badge");
    var swatch = el("span", "swatch");
    swatch.style.background = domainColor[node.domain] || "#64748b";
    domainBadge.appendChild(swatch);
    domainBadge.appendChild(document.createTextNode(domainLabel[node.domain] || node.domain));
    badges.appendChild(domainBadge);

    if (raw.status) {
      var st = el("span", "badge");
      var chip = el("span", "chip " + (raw.status === "done" ? "done" : "wip"),
        raw.status === "done" ? "已实现" : "未实现");
      st.appendChild(chip);
      badges.appendChild(st);
    }
    if (node.missing) {
      var missing = el("span", "badge");
      var missingChip = el("span", "chip wip", "引用缺失");
      missing.appendChild(missingChip);
      badges.appendChild(missing);
    }
    if (node.prepared) {
      var prepared = el("span", "badge");
      prepared.appendChild(el("span", "chip wip", "可提前准备"));
      badges.appendChild(prepared);
    }
    if (raw.stage) badges.appendChild(el("span", "badge", "Stage " + raw.stage));
    if (raw.priority) badges.appendChild(el("span", "badge", raw.priority));
    if (raw.manager) badges.appendChild(el("span", "badge", "✓ 有管理器"));
    detailEl.appendChild(badges);

    if (raw.description) detailEl.appendChild(el("p", "note", raw.description));
    if (raw.notes) detailEl.appendChild(el("p", "note", raw.notes));

    if (raw.fields && raw.fields.length) {
      detailEl.appendChild(el("h4", null, "字段 (" + raw.fields.length + ")"));
      var table = el("table", "fields");
      var thead = el("thead");
      var hr = el("tr");
      ["字段", "类型", "约束", "说明"].forEach(function (h) { hr.appendChild(el("th", null, h)); });
      thead.appendChild(hr);
      table.appendChild(thead);
      var tbody = el("tbody");
      raw.fields.forEach(function (f) {
        var tr = el("tr");
        tr.appendChild(el("td", "name", f.name));
        tr.appendChild(el("td", "type", f.type));
        tr.appendChild(el("td", "constraint", f.constraint));
        tr.appendChild(el("td", null, f.description));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      detailEl.appendChild(table);
    }

    if (raw.enums && raw.enums.length) {
      raw.enums.forEach(function (en) {
        detailEl.appendChild(el("h4", null, en.name));
        var list = el("ul", "rel-list");
        en.values.forEach(function (pair) {
          var li = el("li");
          var link = el("div", "rel-link");
          link.appendChild(el("span", "rel", pair[0]));
          link.appendChild(el("span", "tgt", pair[1]));
          li.appendChild(link);
          list.appendChild(li);
        });
        detailEl.appendChild(list);
      });
    }

    if (raw.mappings && raw.mappings.length) {
      detailEl.appendChild(el("h4", null, "映射到内部制品（as）"));
      var mlist = el("ul", "rel-list");
      raw.mappings.forEach(function (m) {
        var li = el("li");
        var link = el("div", "rel-link");
        link.appendChild(el("span", "rel", m.artifactType));
        link.appendChild(el("span", "tgt", m.artifactId));
        li.appendChild(link);
        mlist.appendChild(li);
      });
      detailEl.appendChild(mlist);
    }

    var outgoing = [], incoming = [];
    state.graph.edges.forEach(function (e) {
      if (e.source.id === node.id) outgoing.push(e);
      if (e.target.id === node.id && e.source.id !== node.id) incoming.push(e);
    });
    if (outgoing.length) {
      detailEl.appendChild(el("h4", null, "出向关系 (" + outgoing.length + ")"));
      detailEl.appendChild(relationList(outgoing, "out"));
    }
    if (incoming.length) {
      detailEl.appendChild(el("h4", null, "入向关系 (" + incoming.length + ")"));
      detailEl.appendChild(relationList(incoming, "in"));
    }

    if (node.id === "module") {
      var contained = state.graph.edges.filter(function (e) {
        return e.source.id === "module" && e.relation === "CONTAINS";
      });
      detailEl.appendChild(el("h4", null, "包含的制品 (" + contained.length + ")"));
      var containedList = el("ul", "rel-list");
      contained.forEach(function (e) {
        var li = el("li");
        var btn = el("button", "rel-link");
        btn.type = "button";
        btn.appendChild(el("span", "rel", e.target.prefix));
        btn.appendChild(el("span", "tgt", e.target.label));
        btn.addEventListener("click", function () { selectNode(e.target); });
        li.appendChild(btn);
        containedList.appendChild(li);
      });
      detailEl.appendChild(containedList);
      detailEl.appendChild(el("p", "note", "Module 是组织容器：它把属于同一服务边界的制品收在一起。"));
    }

    if (raw.definition) {
      detailEl.appendChild(el("h4", null, "定义文档"));
      var link = el("a", null, raw.definition);
      link.href = BASE + raw.definition;
      detailEl.appendChild(link);
    }

    if (raw.raw) {
      detailEl.appendChild(el("h4", null, "原始数据"));
      var pre = el("pre", "raw");
      pre.textContent = JSON.stringify(raw.raw, null, 2);
      detailEl.appendChild(pre);
    }
  }

  function relationList(edges, dir) {
    var list = el("ul", "rel-list");
    edges.forEach(function (e) {
      var other = dir === "out" ? e.target : e.source;
      var li = el("li");
      var btn = el("button", "rel-link");
      btn.type = "button";
      btn.appendChild(el("span", "rel", e.relation));
      btn.appendChild(el("span", "tgt", other.label));
      btn.appendChild(el("span", "dir", dir === "out" ? "→" : "←"));
      btn.addEventListener("click", function () { selectNode(other); });
      li.appendChild(btn);
      list.appendChild(li);
    });
    return list;
  }

  function selectNode(node) {
    state.selected = node;
    refreshHighlight();
    showDetail(node);
  }

  function selectPhase(phase) {
    clear(detailEl);
    detailEl.appendChild(el("h3", null, phase.label));
    detailEl.appendChild(el("div", "sub", phase.question));

    var badges = el("div", "badge-row");
    if (phase.lateral) {
      var lateral = el("span", "badge");
      lateral.appendChild(el("span", "chip wip", "横切关注点"));
      badges.appendChild(lateral);
    }
    badges.appendChild(el("span", "badge", (phase.produces || []).length + " 产出"));
    badges.appendChild(el("span", "badge", (phase.prepares || []).length + " 可提前准备"));
    badges.appendChild(el("span", "badge", phase.handoff.length + " 次交接"));
    detailEl.appendChild(badges);

    function artifactList(ids, title) {
      if (!ids || !ids.length) return;
      detailEl.appendChild(el("h4", null, title));
      var list = el("ul", "rel-list");
      ids.forEach(function (id) {
        var node = state.graph.byId[id];
        if (!node) return;
        var li = el("li");
        var btn = el("button", "rel-link");
        btn.type = "button";
        btn.appendChild(el("span", "rel", node.prefix));
        btn.appendChild(el("span", "tgt", node.label));
        btn.addEventListener("click", function () { selectNode(node); });
        li.appendChild(btn);
        list.appendChild(li);
      });
      detailEl.appendChild(list);
    }

    artifactList(phase.produces, "本阶段产出");
    artifactList(phase.prepares, "可提前准备（不由本阶段产出）");

    if (phase.handoff.length) {
      detailEl.appendChild(el("h4", null, "交接（上一阶段 → 本阶段）"));
      var hlist = el("ul", "rel-list");
      phase.handoff.forEach(function (handoff) {
        var source = state.graph.byId[handoff.source];
        var target = state.graph.byId[handoff.target];
        if (!source || !target) return;
        var li = el("li");
        var btn = el("button", "rel-link");
        btn.type = "button";
        btn.appendChild(el("span", "rel", handoff.relation));
        btn.appendChild(el("span", "tgt", source.label + " → " + target.label));
        btn.addEventListener("click", function () { selectNode(target); });
        li.appendChild(btn);
        hlist.appendChild(li);
      });
      detailEl.appendChild(hlist);
    }
  }

  // ── Sidebar ───────────────────────────────────────────────────────────
  function buildSidebar() {
    var domList = document.getElementById("domainFilters");
    clear(domList);
    // The implementation status only exists in the type catalogue.
    document.getElementById("statusPanel").style.display =
      state.view === "schema" ? "" : "none";
    DATA.domains.forEach(function (d) {
      var count = state.graph.nodes.filter(function (n) { return n.domain === d.key; }).length;
      if (!count) return;
      var li = el("li");
      var row = el("label", "filter-row");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!state.domains[d.key];
      cb.addEventListener("change", function () {
        state.domains[d.key] = cb.checked;
        row.classList.toggle("off", !cb.checked);
        refreshHighlight();
        updateStats();
      });
      var sw = el("span", "swatch");
      sw.style.background = d.color;
      row.appendChild(cb);
      row.appendChild(sw);
      row.appendChild(el("span", "label", d.label));
      row.appendChild(el("span", "num", String(count)));
      li.appendChild(row);
      domList.appendChild(li);
    });

    var relList = document.getElementById("relationFilters");
    clear(relList);
    var used = {};
    state.graph.edges.forEach(function (e) { used[e.relation] = (used[e.relation] || 0) + 1; });
    // A relation that only exists in the current view starts enabled.
    Object.keys(used).forEach(function (name) {
      if (!(name in state.relations)) state.relations[name] = true;
    });
    Object.keys(state.relations).sort(function (a, b) {
      return (used[b] || 0) - (used[a] || 0) || a.localeCompare(b);
    })
      .forEach(function (name) {
        var li = el("li");
        var row = el("label", "filter-row");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!state.relations[name];
        cb.addEventListener("change", function () {
          state.relations[name] = cb.checked;
          row.classList.toggle("off", !cb.checked);
          refreshHighlight();
          updateStats();
        });
        row.appendChild(cb);
        row.appendChild(el("span", "label", name));
        row.appendChild(el("span", "num", String(used[name])));
        li.appendChild(row);
        relList.appendChild(li);
      });
    document.getElementById("relationCount").textContent =
      Object.keys(used).filter(function (k) { return state.relations[k]; }).length + " / " + Object.keys(used).length;

    var stList = document.getElementById("statusFilters");
    clear(stList);
    [["done", "已实现"], ["not-started", "未实现"]].forEach(function (pair) {
      var li = el("li");
      var row = el("label", "filter-row");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!state.statuses[pair[0]];
      cb.addEventListener("change", function () {
        state.statuses[pair[0]] = cb.checked;
        row.classList.toggle("off", !cb.checked);
        refreshHighlight();
        updateStats();
      });
      row.appendChild(cb);
      row.appendChild(el("span", "label", pair[1]));
      li.appendChild(row);
      stList.appendChild(li);
    });
  }

  // ── Interaction ───────────────────────────────────────────────────────
  var drag = null;
  var pan = null;

  svg.addEventListener("mousedown", function (event) {
    var target = event.target;
    var nodeEl = target.closest ? target.closest(".node") : null;
    if (nodeEl && nodeEl.getAttribute("data-id")) {
      var id = nodeEl.getAttribute("data-id");
      var node = state.graph.byId[id];
      if (!node) return;
      drag = { node: node, moved: false };
      node.fx = node.x; node.fy = node.y;
      alpha = Math.max(alpha, 0.35);
      event.preventDefault();
      return;
    }
    pan = { x: event.clientX, y: event.clientY, tx: state.transform.x, ty: state.transform.y };
    svg.classList.add("panning");
  });

  window.addEventListener("mousemove", function (event) {
    if (drag) {
      var pt = toGraph(event.clientX, event.clientY);
      drag.node.fx = pt.x;
      drag.node.fy = pt.y;
      drag.moved = true;
      alpha = Math.max(alpha, 0.3);
      return;
    }
    if (pan) {
      state.transform.x = pan.tx + (event.clientX - pan.x);
      state.transform.y = pan.ty + (event.clientY - pan.y);
      applyTransform();
    }
  });

  window.addEventListener("mouseup", function (event) {
    if (drag) {
      var node = drag.node;
      if (!drag.moved) {
        selectNode(node);
      }
      drag = null;
      return;
    }
    pan = null;
    svg.classList.remove("panning");
    if (event) { /* keep the signature explicit for readability */ }
  });

  svg.addEventListener("click", function (event) {
    var hit = event.target.closest ? event.target.closest(".node, .band") : null;
    if (hit && hit.classList.contains("band")) return;
    if (!hit) {
      state.selected = null;
      refreshHighlight();
      clear(detailEl);
      detailEl.appendChild(el("div", "empty", "点击图中的节点查看制品定义与关系"));
    }
  });

  svg.addEventListener("dblclick", function (event) {
    var nodeEl = event.target.closest ? event.target.closest(".node") : null;
    if (!nodeEl) return;
    var node = state.graph.byId[nodeEl.getAttribute("data-id")];
    if (node) focusNode(node);
  });

  svg.addEventListener("wheel", function (event) {
    event.preventDefault();
    var rect = svg.getBoundingClientRect();
    var mx = event.clientX - rect.left;
    var my = event.clientY - rect.top;
    var factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
    var k = Math.max(0.15, Math.min(4, state.transform.k * factor));
    var ratio = k / state.transform.k;
    state.transform.x = mx - (mx - state.transform.x) * ratio;
    state.transform.y = my - (my - state.transform.y) * ratio;
    state.transform.k = k;
    applyTransform();
  }, { passive: false });

  svg.addEventListener("mousemove", function (event) {
    var nodeEl = event.target.closest ? event.target.closest(".node") : null;
    if (!nodeEl) { tooltipEl.classList.remove("show"); return; }
    var node = state.graph.byId[nodeEl.getAttribute("data-id")];
    if (!node) return;
    var rect = svg.getBoundingClientRect();
    tooltipEl.textContent = node.label + "  ·  " + (node.prefix || "") +
      "  ·  " + (domainLabel[node.domain] || node.domain);
    tooltipEl.style.left = (event.clientX - rect.left + 14) + "px";
    tooltipEl.style.top = (event.clientY - rect.top + 14) + "px";
    tooltipEl.classList.add("show");
  });

  svg.addEventListener("mouseleave", function () { tooltipEl.classList.remove("show"); });

  function toGraph(clientX, clientY) {
    var rect = svg.getBoundingClientRect();
    var t = state.transform;
    return {
      x: (clientX - rect.left - t.x) / t.k,
      y: (clientY - rect.top - t.y) / t.k
    };
  }

  function focusNode(node) {
    var rect = svg.getBoundingClientRect();
    var k = Math.max(state.transform.k, 1.4);
    state.transform.k = k;
    state.transform.x = rect.width / 2 - node.x * k;
    state.transform.y = rect.height / 2 - node.y * k;
    applyTransform();
    selectNode(node);
  }

  function fitToView() {
    if (state.view === "mainline") {
      fitMainline();
      return;
    }
    var graph = state.graph;
    var visible = graph.nodes.filter(isVisible);
    if (!visible.length) return;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    visible.forEach(function (n) {
      minX = Math.min(minX, n.x - n.radius);
      minY = Math.min(minY, n.y - n.radius);
      maxX = Math.max(maxX, n.x + n.radius);
      maxY = Math.max(maxY, n.y + n.radius);
    });
    var rect = svg.getBoundingClientRect();
    var pad = 70;
    var k = Math.min((rect.width - pad * 2) / Math.max(1, maxX - minX),
                     (rect.height - pad * 2) / Math.max(1, maxY - minY));
    k = Math.max(0.15, Math.min(2.2, k));
    state.transform.k = k;
    state.transform.x = rect.width / 2 - ((minX + maxX) / 2) * k;
    state.transform.y = rect.height / 2 - ((minY + maxY) / 2) * k;
    applyTransform();
  }

  function fitMainline() {
    // 主线比视口高：按宽度对齐到顶部，靠滚动/拖拽看下面的阶段
    state.transform.k = 1;
    state.transform.x = 20;
    state.transform.y = 10;
    applyTransform();
  }

  // ── Controls ──────────────────────────────────────────────────────────
  document.querySelectorAll(".view-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      if (tab.disabled) return;
      document.querySelectorAll(".view-tab").forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      state.view = tab.getAttribute("data-view");
      state.selected = null;
      state.graph = state.view === "schema" ? buildSchemaGraph()
        : state.view === "mainline" ? buildMainlineGraph()
          : buildInstanceGraph();
      buildDom();
      buildSidebar();
      seedPositions(state.graph);
      alpha = 1;
      autoFit = true;
      refreshHighlight();
      updateStats();
      clear(detailEl);
      detailEl.appendChild(el("div", "empty", "点击图中的节点查看制品定义与关系"));

      var isMainline = state.view === "mainline";
      document.getElementById("mainlineLegend").hidden = !isMainline;
      document.getElementById("layoutSel").disabled = isMainline;
      if (isMainline) {
        layoutMainline(state.graph);
        buildBands();
        updatePositions();
        fitMainline();
      }
    });
  });

  document.getElementById("layoutSel").addEventListener("change", function (event) {
    state.layout = event.target.value;
    state.graph.nodes.forEach(function (n) { n.fx = null; n.fy = null; });
    alpha = 1;
    autoFit = true;
  });

  document.getElementById("labelsChk").addEventListener("change", function (event) {
    state.showLabels = event.target.checked;
    refreshHighlight();
  });

  document.getElementById("dimChk").addEventListener("change", function (event) {
    state.dimMode = event.target.checked;
    refreshHighlight();
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    DATA.domains.forEach(function (d) { state.domains[d.key] = true; });
    Object.keys(state.relations).forEach(function (k) { state.relations[k] = true; });
    state.statuses = { done: true, "not-started": true };
    state.query = "";
    document.getElementById("search").value = "";
    state.selected = null;
    buildSidebar();
    refreshHighlight();
    updateStats();
    alpha = 1;
    autoFit = true;
  });

  document.getElementById("themeBtn").addEventListener("click", function () {
    document.body.classList.toggle("light");
  });

  document.getElementById("fitBtn").addEventListener("click", fitToView);

  var searchTimer = null;
  document.getElementById("search").addEventListener("input", function (event) {
    var value = event.target.value;
    window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(function () {
      state.query = value.trim();
      refreshHighlight();
    }, 120);
  });

  document.getElementById("search").addEventListener("keydown", function (event) {
    if (event.key !== "Enter") return;
    var hit = state.graph.nodes.filter(function (n) { return isVisible(n) && matches(n); })[0];
    if (hit) focusNode(hit);
  });

  window.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      state.selected = null;
      state.query = "";
      document.getElementById("search").value = "";
      refreshHighlight();
      clear(detailEl);
      detailEl.appendChild(el("div", "empty", "点击图中的节点查看制品定义与关系"));
    }
    if (event.key === "f" || event.key === "F") {
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      fitToView();
    }
  });

  window.addEventListener("resize", function () {
    if (state.view === "mainline") {
      layoutMainline(state.graph);
      updatePositions();
    }
    applyTransform();
  });

  // ── Simulation loop ───────────────────────────────────────────────────
  var alpha = 1;
  var autoFit = true;

  function frame() {
    var graph = state.graph;
    if (graph) {
      if (state.view === "mainline") {
        // 主线是确定性的布局，不跑力学模拟
      } else if (state.layout === "force") {
        if (alpha > 0.005) {
          stepForce(graph, alpha);
          alpha *= 0.985;
        }
      } else if (alpha > 0.02) {
        if (state.layout === "domain") layoutDomain(graph);
        else layoutRadial(graph);
        alpha *= 0.9;
      }
      updatePositions();
      if (autoFit && alpha <= 0.02 && state.view !== "mainline") {
        // The layout has settled -- frame it once.
        autoFit = false;
        fitToView();
      }
    }
    requestAnimationFrame(frame);
  }

  // ── Boot ──────────────────────────────────────────────────────────────
  function boot() {
    state.graph = buildSchemaGraph();
    buildDom();
    buildSidebar();
    seedPositions(state.graph);
    refreshHighlight();
    updateStats();

    var implemented = DATA.types.filter(function (t) { return t.status === "done"; }).length;
    var spine = DATA.edges.filter(function (e) { return e.mainline; }).length;
    document.getElementById("subtitle").textContent =
      DATA.types.length + " 种制品 · " + DATA.edges.length + " 条关系 · " +
      implemented + " 种已实现 · 主线 " + DATA.phases.length + " 阶段 / " + spine + " 次交接";

    var instanceTab = document.getElementById("instanceTab");
    if (DATA.instances && DATA.instances.nodes && DATA.instances.nodes.length) {
      instanceTab.disabled = false;
      instanceTab.textContent = "实例图 (" + DATA.instances.nodes.length + ")";
    }
    requestAnimationFrame(frame);
  }

  boot();
})();
</script>
</body>
